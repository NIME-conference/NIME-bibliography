# Runs the nime_bib tests and validates the proceedings files on every pull
# request and push to master, so that a code regression or a malformed .bib
# entry cannot be merged. bibtexparser discards entries it cannot parse
# without raising, so `make` alone will happily build and deploy an archive
# with a paper missing from it.
name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Setup nime_bib
        run: poetry install
      - name: Run tests
        run: poetry run python -m pytest -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Setup nime_bib
        run: poetry install
      - name: Validate proceedings files
        run: poetry run python nime_bib validate
      - name: Collate files
        run: make
      - name: Validate collated output
        run: poetry run python nime_bib validate --release

# Validates the proceedings files on every pull request, so that a malformed
# .bib entry cannot be merged. bibtexparser discards entries it cannot parse
# without raising, so `make` alone will happily build and deploy an archive
# with a paper missing from it.
name: Validate proceedings

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Setup nime_bib
        run: poetry install
      - name: Validate proceedings files
        run: poetry run python nime_bib validate
      - name: Collate files
        run: make
      - name: Validate collated output
        run: poetry run python nime_bib validate --release
